{% extends "base.html" %}
{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}
{% block content %}
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p>Published: {{ page.date | date(format="%Y-%m-%d") }}</p>{% endif %}
  {{ page.content | safe }}
  <div class="post-footer">
    <small>Back to <a href="/">home</a></small>
  </div>
{% endblock content %}
